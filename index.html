<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hạt Kiểm lâm Khu vực I - Đồng Tháp</title>
    
    <!-- Nhúng thư viện hỗ trợ Tìm kiếm -->
    <link href="https://jsdelivr.net" rel="stylesheet" />
    <script src="https://jquery.com"></script>
    <script src="https://jsdelivr.net"></script>

    <style>
        body { font-family: 'Arial', sans-serif; padding: 20px; background-color: #f0f2f5; }
        .box { background: white; padding: 30px; border-radius: 10px; max-width: 800px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #1b5e20; text-align: center; margin-bottom: 5px; }
        .sub-title { text-align: center; color: #666; margin-bottom: 25px; }
        label { font-weight: bold; display: block; margin-bottom: 10px; }
        .select2-container { width: 100% !important; }
        #ket-qua { margin-top: 20px; padding: 15px; background: #e8f5e9; border-radius: 5px; display: none; border-left: 5px solid #1b5e20; }
        #map-container { margin-top: 20px; display: none; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; }
    </style>
</head>
<body>

<div class="box">
    <h2>HẠT KIỂM LÂM KHU VỰC I</h2>
    <p class="sub-title">Chi cục Kiểm lâm tỉnh Đồng Tháp</p>
    
    <label>Chọn hoặc tìm nhanh xã/phường:</label>
    <select id="tim-kiem-dia-ban">
        <option value="">Gõ tên xã hoặc phường để tìm...</option>
        <option>Xã Tân Hồng</option><option>Xã Tân Thành</option><option>Xã Tân Hộ Cơ</option>
        <option>Xã An Phước</option><option>Xã Thường Phước</option><option>Xã Long Khánh</option>
        <option>Xã Long Phú Thuận</option><option>Xã An Hòa</option><option>Xã Tam Nông</option>
        <option>Xã Phú Thọ</option><option>Xã Tràm Chim</option><option>Xã Phú Cường</option>
        <option>Xã An Long</option><option>Xã Thanh Bình</option><option>Xã Tân Thạnh</option>
        <option>Xã Bình Thành</option><option>Xã Tân Long</option><option>Xã Mỹ An Hưng</option>
        <option>Xã Tân Khánh Trung</option><option>Xã Lấp Vò</option><option>Xã Lai vung</option>
        <option>Xã Hòa Long</option><option>Xã Phong Hòa</option><option>Xã Tân Dương</option>
        <option>Xã Phú Hựu</option><option>Xã Tân Nhuận Đông</option><option>Xã Tân Phú Trung</option>
        <option>Phường An Bình</option><option>Phường Hồng Ngự</option><option>Phường Thường Lạc</option>
        <option>Phường Cao Lãnh</option><option>Phường Mỹ Ngãi</option><option>Phường Mỹ Trà</option>
        <option>Phường Sa Đéc</option><option>Xã Phong Mỹ</option>
    </select>

    <!-- Hiển thị tên đơn vị đang chọn -->
    <div id="ket-qua">
        <strong>📍 Đang xem bản đồ:</strong> <span id="ten-xa-chon"></span>
    </div>

    <!-- Khung hiển thị bản đồ Google Maps -->
    <div id="map-container">
        <iframe id="google-map" width="100%" height="450" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
    </div>
</div>

<script>
    $(document).ready(function() {
        // Kích hoạt ô tìm kiếm thông minh
        $('#tim-kiem-dia-ban').select2({
            placeholder: "Nhập tên địa bàn..."
        });

        // Xử lý khi người dùng chọn xã/phường
        $('#tim-kiem-dia-ban').on('change', function() {
            var tenDiaBan = $(this).val();
            
            if(tenDiaBan) {
                // Hiện thông tin tên xã
                $('#ten-xa-chon').text(tenDiaBan);
                $('#ket-qua').show();

                // Tạo link bản đồ tự động dựa trên tên xã + Đồng Tháp
                var diaChiSearch = encodeURIComponent(tenDiaBan + ", Đồng Tháp, Việt Nam");
                var linkBanDo = "https://google.com" + diaChiSearch + "&output=embed";
                
                // Cập nhật và hiển thị bản đồ
                $('#google-map').attr('src', linkBanDo);
                $('#map-container').fadeIn();
            }
        });
    });
</script>

</body>
</html>
